# ============================================================
# SlayMuManager 自动发布工作流
# 推送 v* 标签时触发，构建 MSI 并创建 GitHub Release
# ============================================================

name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Setup Rust
        uses: actions-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install deps
        run: npm ci
        working-directory: app

      - name: Build & Release (Tauri)
        uses: tauri-apps/tauri-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          projectPath: app
          tagName: v__VERSION__
          releaseName: "SlayMuManager v__VERSION__"
          releaseBody: |
            请根据 README 中的安装说明使用。

            ## 更新内容
            详见 Changelog
          releaseDraft: true
          prerelease: false
