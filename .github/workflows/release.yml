# ============================================================
# SlayMuManager 自动发布工作流
# 推送 v* 标签时触发，自动创建 GitHub Release（仅源码）
# GitHub 会自动为 Release 附加源码压缩包
# ============================================================

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
