# ============================================================
# SlayMuManager Windows 安装包构建与发布工作流
# 触发后在 Windows Runner 上构建 NSIS 安装包，
# 上传至 Actions Artifact 并发布/附加到对应版本的 GitHub Release
# ============================================================

name: Build Windows Installer

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (optional, defaults to v<package.json version>)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend lint
        run: pnpm run lint

      - name: Add rust-lld to PATH
        shell: pwsh
        run: |
          $sysroot = rustc --print sysroot
          Add-Content -Path $env:GITHUB_PATH -Value "$sysroot\lib\rustlib\x86_64-pc-windows-msvc\bin"

      - name: Build Tauri Windows installer (NSIS)
        env:
          RUSTC_WRAPPER: ""
          CARGO_BUILD_RUSTC_WRAPPER: ""
        run: pnpm tauri build --bundles nsis

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: SlayMuManager-windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Prepare release metadata
        id: release_meta
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $ver = $pkg.version
          $tag = "${{ inputs.tag }}"
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $tag = "v$ver"
          }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          $key = "v" + ($ver -replace '\.', '_')
          $zh = Get-Content src/i18n/zh-CN.json -Raw -Encoding utf8 | ConvertFrom-Json
          $note = $zh.releaseNotes.$key
          $bodyPath = Join-Path $env:RUNNER_TEMP "release_body.md"
          if ($note) {
            $lines = @("release: $tag - $($note.title)", "")
            if ($note.changes) {
              foreach ($c in $note.changes) {
                $lines += "- $c"
              }
            }
            $lines | Out-File -FilePath $bodyPath -Encoding utf8
          } else {
            git log -1 --format="%B" | Out-File -FilePath $bodyPath -Encoding utf8
          }

      - name: Publish installer to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: ${{ steps.release_meta.outputs.tag }}
          body_path: ${{ runner.temp }}/release_body.md
          files: src-tauri/target/release/bundle/nsis/*.exe
          draft: false
