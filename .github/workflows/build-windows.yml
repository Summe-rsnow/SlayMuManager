# ============================================================
# SlayMuManager Windows 安装包构建工作流
# 支持手动触发（workflow_dispatch），在 Windows Runner 上构建 NSIS 安装包
# 构建产物通过 GitHub Actions Artifact 上传供下载
# ============================================================

name: Build Windows Installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend lint
        run: pnpm run lint

      - name: Add rust-lld to PATH
        shell: pwsh
        run: |
          $sysroot = rustc --print sysroot
          Add-Content -Path $env:GITHUB_PATH -Value "$sysroot\lib\rustlib\x86_64-pc-windows-msvc\bin"

      - name: Build Tauri Windows installer (NSIS)
        env:
          RUSTC_WRAPPER: ""
          CARGO_BUILD_RUSTC_WRAPPER: ""
        run: pnpm tauri build --bundles nsis

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: SlayMuManager-windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
