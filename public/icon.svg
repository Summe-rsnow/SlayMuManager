  <rect x="30" y="26" width="88" height="68" rx="8" fill="#fff" opacity=".18"/>
  <!-- S 字母 -->
  <text x="64" y="84" font-family="system-ui,-apple-system,sans-serif" font-size="58" font-weight="800" fill="#fff" text-anchor="middle">S</text>
